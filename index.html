<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23002FA7'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23ffffff' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070B16" media="(prefers-color-scheme: dark)" />
    <title>Folio — A Catalogue of Books Worth Your Time</title>
    <meta name="description" content="Folio is a reading catalogue: find books worth your time, keep shelves, write reviews, and follow a yearly reading goal." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..500&family=Instrument+Sans:ital,wght@0,400..700;1,400..500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the appearance before first paint so the paper never flashes.
      try {
        var stored = localStorage.getItem('folio_theme_v1');
        var theme = stored
          ? JSON.parse(stored)
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }

      // GitHub Pages has no server rewrites, so a deep link such as
      // /folio/explore 404s before this app loads. public/404.html catches
      // that, sends the reader here, and leaves the address they wanted in
      // sessionStorage. Put it back now, before React reads the URL.
      try {
        var intended = sessionStorage.getItem('folio:redirect');
        if (intended) {
          sessionStorage.removeItem('folio:redirect');
          history.replaceState(null, '', intended);
        }
      } catch (e) {
        // No session storage available; the app still starts normally.
      }
    </script>
    <script type="module" crossorigin src="/folio/assets/index-BzkdOBCT.js"></script>
    <link rel="stylesheet" crossorigin href="/folio/assets/index-BUFTarsq.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
