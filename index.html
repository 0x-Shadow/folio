<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio — Discover Your Next Read</title>
    <meta name="description" content="Folio is a sophisticated book review platform for discovering, reviewing, and organizing your reading journey." />
  </head>
  <body>
    <script>
      // Apply theme before first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem('folio_theme_v1');
        t = t ? JSON.parse(t) : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
